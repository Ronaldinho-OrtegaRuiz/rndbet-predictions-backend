spring.application.name=rndbet-predictions-backend

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Envío diario de partidos al scraper (live track). POST JSON a esta URL (sobrescribir en prod / .env).
scraper.live-track.enabled=false
scraper.live-track.url=http://localhost:8000/api/live-track/ingest
scraper.live-track.dispatch-cron=0 0 5 * * ?
scraper.live-track.time-zone=America/Bogota
# Al arrancar: una pasada igual que el cron (solo partidos del día con live_track_enqueued=false)
scraper.live-track.run-on-startup=true

spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=jdbc:postgresql://aws-0-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.xlswyviswmgyqjcprnmb
spring.datasource.password=${SUPABASE_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}

# JWT (carga desde .env vía DotenvLoader → SECRET_TOKEN_JWT, o variable de entorno)
jwt.secret=${SECRET_TOKEN_JWT:}
jwt.expiration-ms=259200000
